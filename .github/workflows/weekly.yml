name: Weekly Play Store rating dashboard
on:
  schedule:
    - cron: "30 3 * * 1"      # every Monday 03:30 UTC (09:00 IST)
  workflow_dispatch: {}        # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python src/weekly_dashboard.py
      - name: Commit refreshed data and dashboard
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Weekly ratings refresh"
          git push
